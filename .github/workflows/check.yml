# The same checks as ./check, run by GitHub on every pull request and every push to main.
# Written in 0.9.5; it runs on GitHub during the trial (docs/dev/move-to-github.md).
#
# Kept off Forgejo: every job starts with `if: github.server_url == 'https://github.com'`,
# so on Forgejo each job is skipped and needs no runner (see docs/dev/move-to-github.md).
#
# Nothing here sends anything about an install anywhere. It runs ./check, which only
# downloads dependencies and vulnerability databases (see its header).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A newer push to a pull request stops the older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Proposed, for cabledrawer: skip on any server that is not GitHub itself.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04  # amd64
    # Must stay above the whole run: pytest (up to 60 minutes), then the browser tests, image and scanners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # ./check compares with origin/main to decide whether the scanners run.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          # The same uv as the Dockerfile (backend/pyproject.toml needs uv_build >=0.13.1,<0.14).
          version: "0.13.1"
      # The same Python as the Dockerfile's image (T4, 22 Nov). Without this, uv downloads its own
      # build (python-build-standalone, built with Clang), which is not what the app runs on.
      # When the Dockerfile's python:3.14 digest changes, change this version too; the next step
      # fails until they match.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Check this Python is the Dockerfile's
        run: |
          image="$(grep -m1 '^FROM python:' Dockerfile | cut -d' ' -f2)"
          want="$(docker run --rm "$image" python -c 'import platform; print(platform.python_version())')"
          have="$(python -c 'import platform; print(platform.python_version())')"
          echo "Dockerfile: $want, here: $have"
          test "$want" = "$have"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 24
      - name: Run ./check with the scanners on
        env:
          # uv uses the Python above and never downloads one of its own.
          UV_PYTHON: "3.14.10"
          UV_PYTHON_DOWNLOADS: "never"
          CHECK_SCANNERS: "1"
          # GitHub's 4-CPU runner needs more than the 20 minutes that is right for the maintainer's
          # computer (it was stopped at 1230 s; about 14 minutes there). The tests already run in
          # 4 workers (pytest-xdist), one per CPU. ./check's own default stays 20.
          CHECK_LIMIT_PYTEST: "60"
        run: ./check
      - name: Show the summary (the same text ./check tells you to paste into a pull request)
        if: always()
        run: |
          if [ -f .check/summary.md ]; then
            cat .check/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the full log
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: check-log
          path: .check/check.log
          if-no-files-found: ignore
          retention-days: 14

  # Build only, both architectures. Nothing is pushed or logged in to a registry.
  image:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
