# Release: on a tag v1.* (and only then) build the image for amd64 and arm64, push it to GHCR and
# Docker Hub, and make the GitHub release from CHANGELOG.md. Written in 0.9.5, unused until 1.0
# (docs/dev/move-to-github.md).
#
# Nothing can publish by accident: the image names below hold the placeholder <owner>, which is not
# a valid image name. cabledrawer replaces it (and the Docker Hub name) at 1.0 (docs/dev/move-to-github.md).
# Every job also starts with `if: github.server_url == 'https://github.com'`, so Forgejo skips them.
#
# Secrets, by name only: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token limited to
# this one repository). GHCR uses the run's own GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v1.*"]

permissions:
  contents: read

jobs:
  image:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN
    env:
      # Placeholders on purpose: replace <owner> at 1.0.
      GHCR_IMAGE: ghcr.io/<owner>/mealwright
      DOCKERHUB_IMAGE: docker.io/<owner>/mealwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96  # v5.6.1
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          # v1.2.3 gives 1.2.3, 1.2, 1 and latest. A pre-release (v1.3.0-rc.1, any tag with a "-")
          # gets its own exact tag only: never 1.3, 1 or latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # VERSION is 1.2.3, without the tag's "v" (the image's version label).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

  github-release:
    # Only once both images are pushed: a failed build makes no release.
    needs: image
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # make the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Cut this version's notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Make the release (a version with a "-" is marked pre-release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --title "Mealwright ${TAG#v}" --notes-file release-notes.md "${flags[@]}"
