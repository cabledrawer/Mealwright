# Scanner exceptions (cabledrawer, 28 Oct, 31 Oct and 13 Nov 2026; spec section 8, "Scanner warnings
# that don't affect Mealwright"). Only these four: deepmerge 4.3.1 (no fixed version yet), minimatch
# 10.2.6 (fixed only in 11, a new major inside the two-week rule), @sveltejs/adapter-static 4.0.0
# and @sveltejs/kit 3.0.1 (published 13 Nov; a frontend security PR upgrades both before 28 Nov).
# All four stop being ignored on 28 Nov 2026, so ./check fails on them again from then unless a
# fixed version is in.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
