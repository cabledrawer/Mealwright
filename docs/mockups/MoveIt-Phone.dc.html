<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mealwright – Today · Move it sheet (0.6)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: {{ c.bg }}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ c.ink }}; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; color: {{ c.muted }}; font-weight: 600">Sun 25 Oct</span>
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Today</h1>
<div style="background: {{ c.card }}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Did you cook Sambar yesterday?</span>
<span style="display: flex; gap: 6px"><span style="flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: {{ c.chip }}; font-size: 14px; font-weight: 700">Cooked it</span><span style="flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: {{ c.chip }}; font-size: 14px; font-weight: 700">Didn't</span><span style="flex: 1; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid {{ c.green }}; font-size: 14px; font-weight: 700">Move it</span></span>
</div>
</div>

<div style="position: absolute; inset: 0; background: {{ c.scrim }}"></div>

<div role="dialog" aria-label="Move Sambar to" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{ c.sheet }}; border-radius: 24px 24px 0 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 12px">
<span style="width: 40px; height: 5px; border-radius: 3px; background: {{ c.edge }}; align-self: center"></span>
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 18px; font-weight: 800">Move Sambar to…</span><span style="font-size: 12px; color: {{ c.muted }}; font-weight: 600">was Sat dinner</span></span>

<span style="font-size: 13px; font-weight: 700; color: {{ c.muted }}; text-transform: uppercase; letter-spacing: 0.06em">Quick picks</span>
<button aria-pressed="true" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid {{ c.green }}; background: {{ c.selBg }}; color: {{ c.ink }}; font: 700 15px 'Plus Jakarta Sans', sans-serif"><span>Today · Dinner</span><span style="font-size: 12px; font-weight: 600; color: {{ c.muted }}">free</span></button>
<button aria-pressed="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 700 15px 'Plus Jakarta Sans', sans-serif"><span>Tomorrow · Dinner</span><span style="font-size: 12px; font-weight: 600; color: {{ c.muted }}">free</span></button>

<span style="font-size: 13px; font-weight: 700; color: {{ c.muted }}; text-transform: uppercase; letter-spacing: 0.06em">Or pick a day</span>
<div role="group" aria-label="Day" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
<button aria-pressed="true" style="min-height: 52px; border-radius: 12px; border: 2px solid {{ c.green }}; background: {{ c.selBg }}; color: {{ c.ink }}; font: 700 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Sun<br>25</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Mon<br>26</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Tue<br>27</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Wed<br>28</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Thu<br>29</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Fri<br>30</button>
<button aria-pressed="false" style="min-height: 52px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 600 12px/1.3 'Plus Jakarta Sans', sans-serif; padding: 0">Sat<br>31</button>
</div>
<div role="group" aria-label="Meal" style="display: flex; flex-direction: column; gap: 4px">
<button aria-pressed="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 700 14px 'Plus Jakarta Sans', sans-serif"><span>Breakfast</span><span style="font-size: 12px; font-weight: 600; color: {{ c.muted }}">free</span></button>
<button aria-pressed="false" style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid {{ c.edge }}; background: {{ c.card }}; color: {{ c.ink }}; font: 700 14px 'Plus Jakarta Sans', sans-serif"><span>Lunch</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{ c.muted }}"><span style="background: {{ c.tub }}; color: {{ c.tubInk }}; border-radius: 999px; padding: 2px 8px; font-weight: 700">Rasam · tub 2 of 3</span>adds alongside</span></button>
<button aria-pressed="true" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid {{ c.green }}; background: {{ c.selBg }}; color: {{ c.ink }}; font: 700 14px 'Plus Jakarta Sans', sans-serif"><span>Dinner</span><span style="font-size: 12px; font-weight: 600; color: {{ c.muted }}">free</span></button>
</div>

<span style="display: flex; gap: 8px; margin-top: 4px">
<a href="Main.dc.html" style="flex: 1; min-height: 52px; border-radius: 16px; border: 1px solid {{ c.edge }}; color: {{ c.ink }}; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Cancel</a>
<a href="Main.dc.html" style="flex: 1; min-height: 52px; border-radius: 16px; background: {{ c.btn }}; color: {{ c.btnInk }}; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Move to today</a>
</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = {bg:'#F5F6F4',card:'#FFFFFF',sheet:'#F5F6F4',ink:'#17201C',muted:'#5B655F',edge:'#D9DDD8',chip:'#F1F3F0',green:'#2E7D5B',selBg:'#E4F1EA',scrim:'rgba(23,32,28,0.45)',btn:'#17201C',btnInk:'#FFFFFF',tub:'#FDE7B8',tubInk:'#5C3D00'};
const D = {bg:'#111614',card:'#1B221F',sheet:'#161C19',ink:'#E9EEEB',muted:'#A3AFA8',edge:'#33403A',chip:'#252E29',green:'#6FCF9E',selBg:'#1F3A2D',scrim:'rgba(0,0,0,0.6)',btn:'#E9EEEB',btnInk:'#111614',tub:'#4A3A16',tubInk:'#F3D58C'};
return { c: (this.props.theme ?? 'light') === 'dark' ? D : L };
}
}
</script>
</body>
</html>
