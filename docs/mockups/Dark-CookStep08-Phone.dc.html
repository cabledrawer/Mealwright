<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mealwright dark – Cook mode (0.8, F148)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden;background:#111614}
*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#6FCF9E}a:hover{color:#9FE3BF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #111614; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #E9EEEB; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 52px 16px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Dark-Phone-Recipe.dc.html" aria-label="Leave Cook mode" style="width: 44px; height: 44px; border-radius: 22px; background: #252E29; display: flex; align-items: center; justify-content: center; color: #E9EEEB"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 15px; font-weight: 800">Sambar</span><span style="font-size: 12px; color: #A3AFA8; font-weight: 600">Step 5 of 18</span></span>
<sc-if value="{{ awake }}" hint-placeholder-val="{{ false }}">
<span title="Screen stays on" style="display: flex; align-items: center; gap: 4px; background: #1F3A2D; color: #8FE0B5; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>Awake</span>
</sc-if>
<sc-if value="{{ asleep }}" hint-placeholder-val="{{ true }}">
<span style="width: 44px"></span>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px"><span style="height: 5px; border-radius: 3px; background: #6FCF9E"></span><span style="height: 5px; border-radius: 3px; background: #6FCF9E"></span><span style="height: 5px; border-radius: 3px; background: #6FCF9E"></span><span style="height: 5px; border-radius: 3px; background: #6FCF9E"></span><span style="height: 5px; border-radius: 3px; background: #6FCF9E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span><span style="height: 5px; border-radius: 3px; background: #2A332E"></span></div>
<sc-if value="{{ asleep }}" hint-placeholder-val="{{ true }}">
<div role="status" style="display: flex; align-items: center; gap: 10px; background: #2B2416; color: #F3D58C; border-radius: 14px; padding: 10px 12px; font-size: 14px; font-weight: 600; line-height: 1.35"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3a7 7 0 1 0 9 9 7 7 0 0 1-9-9z"></path></svg>Couldn't keep the screen awake.</div>
</sc-if>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 22px 20px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 56px; font-weight: 800; color: #1F3A2D; line-height: 0.9; letter-spacing: -0.04em">5</span>
<p style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.3; color: #F0F4F1">Dry-roast the coriander seeds and red chillies until they smell toasty.</p>

<section aria-label="Ingredients for each step" style="display: flex; flex-direction: column; gap: 12px; background: #1B221F; border: 1px solid #2A332E; border-radius: 18px; padding: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">Ingredients for each step</span>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; background: #3A2238; color: #F2B5E4; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"></path><path d="M10 3v6.2L5.2 18.4A1.8 1.8 0 0 0 6.8 21h10.4a1.8 1.8 0 0 0 1.6-2.6L14 9.2V3"></path><path d="M7.3 15h9.4"></path></svg>Experimental</span>
</span>
<button role="switch" aria-checked="{{ perStepAria }}" aria-label="Show ingredients for each step" onClick="{{ togglePerStep }}" style="width: 52px; height: 32px; border: none; border-radius: 16px; background: {{ switchBg }}; position: relative; padding: 0; flex: none; cursor: pointer"><span style="position: absolute; top: 3px; left: {{ knobLeft }}; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span></button>
</div>
<sc-if value="{{ perStep }}" hint-placeholder-val="{{ true }}">
<span style="display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; border-top: 1px solid #26302B"><span style="background: #252E29; border-radius: 999px; padding: 8px 14px; font-size: 16px; font-weight: 700; margin-top: 8px">2 tbsp coriander seeds</span><span style="background: #252E29; border-radius: 999px; padding: 8px 14px; font-size: 16px; font-weight: 700; margin-top: 8px">4 dried red chillies</span></span>
<span style="font-size: 13px; color: #A3AFA8; line-height: 1.45">Guessed from the step, so it may be wrong. Fix it when you edit the recipe.</span>
</sc-if>
</section>

<button style="border: 1px solid #39433D; background: #1B221F; color: #E9EEEB; border-radius: 16px; min-height: 52px; font: 700 16px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Show ingredients</button>
</div>

<div style="padding: 12px 16px 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; border-top: 1px solid #2A332E">
<button style="border: none; background: #252E29; color: #E9EEEB; border-radius: 18px; min-height: 64px; font: 700 17px 'Plus Jakarta Sans', sans-serif">← Back</button>
<button style="border: none; background: #E9EEEB; color: #111614; border-radius: 18px; min-height: 64px; font: 700 17px 'Plus Jakarta Sans', sans-serif">Next step →</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screenAwake":{"editor":"boolean","default":false},"perStep":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const on = s.perStep !== undefined ? s.perStep : (this.props.perStep ?? true);
const awake = !!this.props.screenAwake;
return {
awake: awake,
asleep: !awake,
perStep: on,
perStepAria: on ? 'true' : 'false',
switchBg: on ? '#2E7D5B' : '#39433D',
knobLeft: on ? '23px' : '3px',
togglePerStep: () => this.setState({ perStep: !on })
};
}
}
</script>
</body>
</html>
