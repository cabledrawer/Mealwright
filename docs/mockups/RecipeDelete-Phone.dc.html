<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mealwright – Recipe page · Delete in the ⋯ menu (0.6)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
*{scrollbar-width:none}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: {{ lay.w }}; height: {{ lay.h }}; padding: 0 {{ lay.side }}; box-sizing: border-box; background: {{ c.bg }}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: {{ c.ink }}; position: relative; overflow: hidden; display: flex; flex-direction: column">
<div style="padding: 52px 16px 16px; display: flex; flex-direction: column; gap: 12px; position: relative">
<span style="display: flex; justify-content: space-between; align-items: center">
<a href="Recipes-Phone.dc.html" style="display: flex; align-items: center; gap: 4px; color: {{ c.green }}; font-size: 15px; font-weight: 700; text-decoration: none; min-height: 44px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Recipes</a>
<span style="display: flex; gap: 6px"><a href="RecipeEditor-Phone.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid {{ c.edge }}; color: {{ c.ink }}; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Edit</a><button aria-label="More" aria-expanded="true" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid {{ c.green }}; background: {{ c.card }}; color: {{ c.ink }}; font: 800 18px 'Plus Jakarta Sans', sans-serif">⋯</button></span>
</span>
<div aria-hidden="true" style="height: 190px; border-radius: 20px; background: {{ c.photo }}; display: flex; align-items: center; justify-content: center; color: {{ c.muted }}; font-size: 13px; font-weight: 600">Recipe photo</div>
<h1 style="margin: 0; font-family: 'Newsreader', serif; font-size: 32px; font-weight: 600">Sambar</h1>
<span style="font-size: 13px; color: {{ c.muted }}; font-weight: 600">Serves 4 · 45 min · used in 3 plans</span>
<div style="background: {{ c.card }}; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<span style="font-size: 13px; font-weight: 700; color: {{ c.muted }}; text-transform: uppercase; letter-spacing: 0.06em">Ingredients</span>
<span>200 g toor dal</span><span>6 drumsticks</span><span>2 onions</span><span>30 g tamarind</span>
</div>

<div role="menu" aria-label="More for Sambar" style="position: absolute; top: 100px; right: 16px; width: 230px; background: {{ c.menu }}; border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.22); padding: 6px; display: flex; flex-direction: column">
<button role="menuitem" style="text-align: left; min-height: 46px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: {{ c.ink }}; font: 700 15px 'Plus Jakarta Sans', sans-serif">Add to plan…</button>
<button role="menuitem" style="text-align: left; min-height: 46px; padding: 0 12px; border: none; border-radius: 10px; background: transparent; color: {{ c.ink }}; font: 700 15px 'Plus Jakarta Sans', sans-serif">Cook mode</button>
<span style="height: 1px; background: {{ c.line }}; margin: 4px 6px"></span>
<button role="menuitem" style="text-align: left; min-height: 46px; padding: 0 12px; border: none; border-radius: 10px; background: {{ c.redBg }}; color: {{ c.red }}; font: 700 15px 'Plus Jakarta Sans', sans-serif">Delete recipe</button>
</div>
</div>

<div role="status" style="position: absolute; left: {{ lay.toastL }}; right: {{ lay.toastL }}; bottom: 28px; background: {{ c.toast }}; color: {{ c.toastInk }}; border-radius: 14px; min-height: 52px; padding: 0 8px 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.25)"><span>After Delete: back on Recipes · “Deleted Sambar”</span><button style="border: none; background: transparent; color: {{ c.toastLink }}; font: 800 14px 'Plus Jakarta Sans', sans-serif; min-height: 44px; padding: 0 10px">Undo</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["phone","desktop"],"default":"phone"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = {bg:'#F5F6F4',card:'#FFFFFF',menu:'#FFFFFF',ink:'#17201C',muted:'#5B655F',edge:'#D3D8D3',line:'#E8EBE7',photo:'#E4E7E3',green:'#2E7D5B',red:'#9C320B',redBg:'#FBEDE7',toast:'#17201C',toastInk:'#FFFFFF',toastLink:'#9FE3BF'};
const D = {bg:'#111614',card:'#1B221F',menu:'#222B27',ink:'#E9EEEB',muted:'#A3AFA8',edge:'#33403A',line:'#2A332E',photo:'#252E29',green:'#6FCF9E',red:'#FF9B76',redBg:'#3A211A',toast:'#E9EEEB',toastInk:'#111614',toastLink:'#1F5C42'};
const lay = (this.props.layout ?? 'phone') === 'desktop' ? {w:'1440px',h:'900px',side:'calc(50% - 320px)',toastL:'calc(50% - 300px)'} : {w:'390px',h:'844px',side:'0px',toastL:'16px'};
return { c: (this.props.theme ?? 'light') === 'dark' ? D : L, lay };
}
}
</script>
</body>
</html>
