  "name": "Charred leeks with hazelnut dressing",
  "description": "<p>Leeks are at their best <em>right now</em>, so let them take centre stage: blistered in a hot pan until sweet and soft, then spooned over with a sharp, crunchy dressing of toasted hazelnuts, parsley and lemon. It is a dish that works as a starter, as a side for a Sunday roast, or piled on toast for lunch.</p>",
  "author": [{"@type": "Person", "name": "Jo Columnist", "sameAs": "https://dailyexample.example/profile/jo"}],

  "recipeIngredient": [
    "6 medium leeks",
    "2 tbsp olive oil",
    "For the dressing:",
    "50g hazelnuts, toasted and chopped",
    "1 small bunch parsley, chopped",
    "1 lemon, zested and juiced",
    "4 tbsp extra-virgin olive oil"
  ],
  "recipeInstructions": "<p>Trim the leeks and cut each into three.</p><p>Cook in a hot dry pan for 10–12 minutes, turning, until charred all over.</p><p>Mix the dressing ingredients, season, and spoon over the warm leeks.</p>"
