[project]
name = "mealwright"
version = "0.9.0a1"
description = "Self-hosted meal planning, pantry and shopping for your household."
license = "AGPL-3.0-only"
authors = [
    { name = "cabledrawer" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler==3.11.3",
    "argon2-cffi==25.1.0",
    # Single sign-on (0.9 O1): its protocol pieces only (PKCE, JOSE, OIDC claims), never its
    # HTTP clients; every request goes through the outbound gate. Brings cryptography.
    "authlib>=1.6.0,<1.7",
    "fastapi>=0.143.3",
    "pillow==13.0.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Needed by FastAPI's TestClient. Stay on httpx until Starlette requires httpx2 (cabledrawer 17 Oct).
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.uv]
# New dependencies: prefer releases at least two weeks old (as for the ./check scanners).
exclude-newer-package = { pycparser = "2026-10-03T00:00:00Z", hypothesis = "2026-10-03T00:00:00Z", sortedcontainers = "2026-10-03T00:00:00Z", apscheduler = "2026-10-03T00:00:00Z", tzlocal = "2026-10-03T00:00:00Z", authlib = "2026-10-29T00:00:00Z", cryptography = "2026-10-29T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Words people read use the curly apostrophe ("Couldn’t"; word list section 11, ruling 3).
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and made-up test passwords

[tool.mypy]
strict = true
packages = ["mealwright"]
mypy_path = "src"

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type information.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Each test's temporary folder is removed as soon as the test ends, and the run's own folder
# in /tmp goes with them (tests/test_tmp_cleanup.py proves it). Without this pytest keeps the
# last three runs' folders, which on 22 Oct filled 2.8 GB of /tmp.
tmp_path_retention_policy = "none"
