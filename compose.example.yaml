# Example Docker Compose file for Mealwright. Copy it to compose.yaml and adjust.
# Mealwright sits behind your own reverse proxy (Caddy, Traefik, nginx, Nginx Proxy
# Manager…), which provides HTTPS. Signing in needs HTTPS.

services:
  mealwright:
    # Always an exact version, never "latest". Update by changing it by hand.
    image: <registry>/mealwright:<version>
    container_name: mealwright
    restart: unless-stopped
    environment:
      # Believe the visitor address (X-Forwarded-For) only from the reverse proxy, which
      # joins the network below. The sign-in slow-down needs real addresses.
      MEALWRIGHT_TRUSTED_PROXIES: "172.28.10.0/24"
      # Only for trying it out over plain http:// on a network you trust:
      # MEALWRIGHT_ALLOW_PLAIN_HTTP: "true"
    volumes:
      # Everything Mealwright keeps. Back this folder up (and before every update).
      # The folder must belong to UID 10001, the user Mealwright runs as:
      #   sudo mkdir -p ./data && sudo chown 10001:10001 ./data
      - ./data:/data
    # Mealwright keeps its own log in data/logs for 14 days. This caps Docker's copy of
    # the same lines, which would otherwise grow forever: at most 3 files of 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # No "ports:" and no "networks:". Mealwright uses only this project's own network
    # (Docker names it <folder>_default, e.g. mealwright_default). Your reverse proxy
    # joins that network as an external one and forwards to http://mealwright:8080.

networks:
  default:
    ipam:
      config:
        # A fixed range, so MEALWRIGHT_TRUSTED_PROXIES can name it. Pick any free one.
        - subnet: 172.28.10.0/24
