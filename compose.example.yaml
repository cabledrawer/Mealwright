# Example Docker Compose file for Mealwright. Copy it to compose.yaml and adjust.
# Mealwright sits behind your own reverse proxy (Caddy, Traefik, nginx, Nginx Proxy
# Manager…), which provides HTTPS. Signing in needs HTTPS.

services:
  mealwright:
    # Always an exact version, never "latest". Update by changing it by hand.
    image: <registry>/mealwright:<version>
    container_name: mealwright
    restart: unless-stopped
    environment:
      # Believe the visitor address (X-Forwarded-For) only from the reverse proxy, which
      # joins the network below. The sign-in slow-down needs real addresses.
      MEALWRIGHT_TRUSTED_PROXIES: "172.28.10.0/24"
      # Only for trying it out over plain http:// on a network you trust:
      # MEALWRIGHT_ALLOW_PLAIN_HTTP: "true"
    volumes:
      # Everything Mealwright keeps. Back this folder up (and before every update).
      # The folder must belong to UID 10001, the user Mealwright runs as:
      #   sudo mkdir -p ./data && sudo chown 10001:10001 ./data
      - ./data:/data
    # Hardening (docs/hardening.md). Mealwright needs none of the extra rights a container
    # gets by default, and writes only to /data and /tmp.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # The only place outside /data that may be written to (temporary files only).
      - /tmp:size=64m,mode=1777
    # A tiny init process, so stopping the container is clean and nothing is left defunct.
    init: true
    # Raise it if you have a very big recipe library; Mealwright normally uses far less.
    mem_limit: 512m
    # Only if the folder on the host can't belong to UID 10001 (for example it is shared
    # with other services and belongs to another user): run as that user instead, e.g.
    # "1000:1000". The data folder must belong to the same UID.
    # user: "10001:10001"
    # Mealwright keeps its own log in data/logs and deletes it after 14 days; sign-in
    # lines (names, addresses) go only there. Docker's copy holds start-up messages,
    # warnings and errors. Docker can only limit it by size, not age: here 2 files of
    # 1 MB, overriding the server's default for this container.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    # No "ports:" and no "networks:". Mealwright uses only this project's own network
    # (Docker names it <folder>_default, e.g. mealwright_default). Your reverse proxy
    # joins that network as an external one and forwards to http://mealwright:8080.

networks:
  default:
    ipam:
      config:
        # A fixed range, so MEALWRIGHT_TRUSTED_PROXIES can name it. Pick any free one.
        - subnet: 172.28.10.0/24
